<!-- Numerals -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none';">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="side-menu" id="sideMenu">
        <div class="Top_Row">
            <h2 class="Menu_Title">Menu</h2>
            <button class="Menu_Close" id="closeMenu" data-pressable_opacity>&times;</button>
        </div>

        <div class="Themes_Section">
            <h1 class="Menu_Subtitle">Themes</h1>

            <button class="Themes_Selector_Button" data-pressable_opacity data-theme="light">
                <h1 class="Themes_Selector_Title">Light Mode</h1>

                <img src="Images/Checkmark.png" alt="Checkmark" class="Checkmark_Image">
            </button>

            <button class="Themes_Selector_Button" data-pressable_opacity data-theme="dark">
                <h1 class="Themes_Selector_Title">Dark Mode</h1>

                <img src="Images/Checkmark.png" alt="Checkmark" class="Checkmark_Image">
            </button>
        </div>
    </nav>

    <div class="overlay" id="overlay"></div>

    <div class="Top_Menu_Draggable">
        <button class="Menu_Button" id="openMenu" data-pressable_opacity>
            <img src="Images/Menu.png" alt="Menu" class="Menu_Icon">
        </button>

        <div class="Draggable_Area"></div>
    </div>

    <div class="Text_Input">
        <div class="history" id="history" aria-live="polite"></div>
        <input
        id="display"
        class="display"
        type="text"
        value="0"
        inputmode="none"
        aria-label="Calculator display"
        readonly
        />
    </div>

    <div class="Button_Row">
        <button class="Square_Button_Left" data-pressable data-action="clear">
            <h1 class="Number_Title">AC</h1>
        </button>

        <button class="Square_Button_Middle" data-pressable data-action="sign">
            <div class="Title_Icon_Positive_Negative">
                <img src="Images/Postive_Negative.png" alt="Postive_Negative" class="Icon">
            </div>
        </button>

        <button class="Square_Button_Middle" data-pressable data-value="%">
            <h1 class="Number_Title">%</h1>
        </button>

        <button class="Square_Button_Right" data-pressable data-value="/">
            <div class="Title_Icon_Divide">
                <img src="Images/Divide.png" alt="Division" class="Icon">
            </div>
        </button>
    </div>

    <div class="Button_Row">
        <button class="Square_Button_Left" data-pressable data-value="7">
            <h1 class="Number_Title">7</h1>
        </button>
        
        <button class="Square_Button_Middle" data-pressable data-value="8">
            <h1 class="Number_Title">8</h1>
        </button>

        <button class="Square_Button_Middle" data-pressable data-value="9">
            <h1 class="Number_Title">9</h1>
        </button>

        <button class="Square_Button_Right" data-pressable data-value="*">
            <div class="Title_Icon">
                <img src="Images/Multiplication.png" alt="Multiplication" class="Icon">
            </div>
        </button>
    </div>

    <div class="Button_Row">
        <button class="Square_Button_Left" data-pressable data-value="4">
            <h1 class="Number_Title">4</h1>
        </button>

        <button class="Square_Button_Middle" data-pressable data-value="5">
            <h1 class="Number_Title">5</h1>
        </button>

        <button class="Square_Button_Middle" data-pressable data-value="6">
            <h1 class="Number_Title">6</h1>
        </button>

        <button class="Square_Button_Right" data-pressable data-value="-">
            <h1 class="Number_Title">-</h1>
        </button>
    </div>

    <div class="Button_Row">
        <button class="Square_Button_Left" data-pressable data-value="1">
            <h1 class="Number_Title">1</h1>
        </button>

        <button class="Square_Button_Middle" data-pressable data-value="2">
            <h1 class="Number_Title">2</h1>
        </button>

        <button class="Square_Button_Middle" data-pressable data-value="3">
            <h1 class="Number_Title">3</h1>
        </button>
        
        <button class="Square_Button_Right" data-pressable data-value="+">
            <h1 class="Number_Title">+</h1>
        </button>
    </div>

    <div class="Button_Row">
        <button class="Square_Button_Left_Wide" data-pressable data-value="0">
            <h1 class="Number_Title">0</h1>
        </button>

        <button class="Square_Button_Middle" data-pressable data-value=".">
            <h1 class="Number_Title">.</h1>
        </button>
        
        <button class="Square_Button_Right" data-pressable data-action="equals">
            <h1 class="Number_Title">=</h1>
        </button>
    </div>

    <script src="button_animation.js"></script>
    <script src="button_animation_opacity.js"></script>
    <script src="user_input.js"></script>
    <script src="menu.js"></script>
    <script src="theme_selector.js"></script>
</body>
</html>
