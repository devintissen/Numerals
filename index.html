<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="Draggable_Area"></div>

    <div class="Text_Input">

    </div>

    <div class="Button_Row">
        <button class="Square_Button_Left" data-pressable>
            <h1 class="Number_Title">AC</h1>
        </button>
        <!-- Update Icon for this button -->
        <button class="Square_Button_Middle" data-pressable>
            <h1 class="Number_Title">+ / -</h1>
        </button>
        <button class="Square_Button_Middle" data-pressable>
            <h1 class="Number_Title">%</h1>
        </button>
        <button class="Square_Button_Right" data-pressable>
            <div class="Title_Icon_Divide">
                <img src="Images/Divide.png" alt="Division" class="Icon">
            </div>
        </button>
    </div>

    <div class="Button_Row">
        <button class="Square_Button_Left" data-pressable>
            <h1 class="Number_Title">7</h1>
        </button>
        <button class="Square_Button_Middle" data-pressable>
            <h1 class="Number_Title">8</h1>
        </button>
        <button class="Square_Button_Middle" data-pressable>
            <h1 class="Number_Title">9</h1>
        </button>
        <!-- Add Icon Later for button below -->
        <button class="Square_Button_Right" data-pressable>
            <div class="Title_Icon">
                <img src="Images/Multiplication.png" alt="Multiplication" class="Icon">
            </div>
        </button>
    </div>

    <div class="Button_Row">
        <button class="Square_Button_Left" data-pressable>
            <h1 class="Number_Title">4</h1>
        </button>
        <button class="Square_Button_Middle" data-pressable>
            <h1 class="Number_Title">5</h1>
        </button>
        <button class="Square_Button_Middle" data-pressable>
            <h1 class="Number_Title">6</h1>
        </button>
        <!-- Add Icon Later for button below -->
        <button class="Square_Button_Right" data-pressable>
            <h1 class="Number_Title">-</h1>
        </button>
    </div>

    <div class="Button_Row">
        <button class="Square_Button_Left" data-pressable>
            <h1 class="Number_Title">1</h1>
        </button>
        <button class="Square_Button_Middle" data-pressable>
            <h1 class="Number_Title">2</h1>
        </button>
        <button class="Square_Button_Middle" data-pressable>
            <h1 class="Number_Title">3</h1>
        </button>
        <!-- Add Icon Later for button below -->
        <button class="Square_Button_Right" data-pressable>
            <h1 class="Number_Title">+</h1>
        </button>
    </div>

    <div class="Button_Row">
        <button class="Square_Button_Left_Wide" data-pressable>
            <h1 class="Number_Title">0</h1>
        </button>
        <button class="Square_Button_Middle" data-pressable>
            <h1 class="Number_Title">.</h1>
        </button>
        <button class="Square_Button_Right" data-pressable>
            <h1 class="Number_Title">=</h1>
        </button>
    </div>

    <script src="button_animation.js"></script>
</body>
</html>
